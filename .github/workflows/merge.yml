name: Merge

on:
  push:
    branches: [main]

jobs:
    image-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}




 # image-push:
   # runs-on: ubuntu-latest
   # steps:
    #  - run: echo "image-push - Task 4 builds the image and pushes it here"

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy - Task 6 deploys the image here"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke-test - Task 6 calls the deployed app here"
